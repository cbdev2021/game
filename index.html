<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadash Web</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="fullscreen-btn" title="Pantalla completa" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
    <div id="touch-ui">
      <div class="dpad">
        <button class="touch-btn" data-action="left">&#9664;</button>
        <button class="touch-btn" data-action="right">&#9654;</button>
        <button class="touch-btn" data-action="up">&#9650;</button>
        <button class="touch-btn" data-action="down">&#9660;</button>
      </div>
      <div class="actions">
        <button class="touch-btn big red" data-action="attack">GOLPE</button>
        <button class="touch-btn big green" data-action="jump">SALTO</button>
        <button class="touch-btn big yellow" data-action="mode">MODO</button>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/entities/classes.js"></script>
  <script src="js/entities/art.js"></script>
  <script src="js/levels/level1.js"></script>
  <script src="js/entities/player.js"></script>
  <script src="js/entities/enemy.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
